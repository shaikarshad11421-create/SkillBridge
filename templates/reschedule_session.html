
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reschedule Session | SkillBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="register-container">

    <h1>Reschedule Session</h1>

    <form method="POST">

        <label>New Session Date</label>
        <input type="date"
               name="session_date"
               min="{{ today }}"
               value="{{ item.session_date }}"
               required>

        <label>New Session Time</label>
        <input type="time"
               name="session_time"
               value="{{ item.session_time }}"
               required>

        <label>Meeting Details</label>
        <textarea name="meeting_details"
                  rows="4">{{ item.meeting_details or "" }}</textarea>

        <button type="submit" class="primary-btn">
            Update Session
        </button>

    </form>

    <br>
    <a href="{{ url_for('my_sessions') }}">Back to My Sessions</a>

</div>

</body>
</html>
